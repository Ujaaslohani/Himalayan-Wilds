; Himalayan Wilds settings (also editable from Options in game)
[video]
width = 1600
height = 900
fullscreen = false
vsync = true
msaa = 0
fxaa = true
; SSAO: soft screen-space contact shadows (costs ~0.3-0.6 ms; baked AO already covers most of it)
ssao = false
shadow_size = 1536
texture_size = 1024
adaptive_quality = true
adaptive_detail = true
tri_budget = 0
ui_scale = 1.00
render_scale = 0.68
draw_distance = 1.87
full_map = false
fps_limit = 30
menu_fps = 30
; leaf depth pre-pass: auto (timed on your GPU), on or off. Turn off if leaves show speckles
leaf_prepass = auto
; temporal upscaling: renders fewer pixels and rebuilds detail from previous frames
temporal_upscale_v2 = false
; eco: automatic quality only raises detail while the GPU stays under ~50% busy (cooler, quieter)
eco_mode = false

[world]
; weather: auto (showers come and go), rain (always raining, except in snow), clear (never rains)
weather = auto
grass_radius = 26
undergrowth_radius = 23
tree_radius = 110
rock_radius = 110

[player]
fov = 75
mouse_sensitivity = 0.0024
player_speed = 4.80
sprint_multiplier = 1.75
gravity = -18.0

[audio]
music_volume = 0.22
sfx_volume = 0.60
