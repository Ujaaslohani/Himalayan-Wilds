; Himalayan Wilds settings. Lives next to the executable.
[video]
width = 1600
height = 900
fullscreen = false
vsync = true
msaa = 2
; FXAA anti-aliasing: much cheaper than MSAA and uses far less VRAM
fxaa = true
shadow_size = 2048
texture_size = 1024
; Dynamic resolution: lowers resolution scale automatically when FPS drops
adaptive_quality = true
; Dynamic detail: pulls tree/rock LOD distances in when the GPU is over budget (keeps 100% resolution)
adaptive_detail = true
; Per-frame forest triangle budget, checked before drawing (0 = off)
tri_budget = 300000
ui_scale = 1.0
; World draw distance multiplier (1.0-3.0)
draw_distance = 3.0
; Render trees and rocks across the whole map (high-end GPUs)
full_map = false
; 3D resolution multiplier (0.5-1.0). Lower = much faster on laptops/integrated GPUs.
render_scale = 1.0
; Frame rate cap while playing (0 = unlimited). Lower = cooler, quieter GPU.
fps_limit = 60
; Frame rate cap in menus, pause and title screen
menu_fps = 30

[world]
grass_radius = 36
undergrowth_radius = 60
tree_radius = 110
rock_radius = 110

[player]
fov = 75
mouse_sensitivity = 0.0024
player_speed = 4.8
sprint_multiplier = 1.75
gravity = -18

[audio]
music_volume = 0.22
sfx_volume = 0.6
