; Himalayan Wilds settings (also editable from Options in game)
[video]
width = 1600
height = 900
fullscreen = false
vsync = true
msaa = 0
fxaa = true
; SSAO: soft screen-space contact shadows (costs ~0.3-0.6 ms; baked AO already covers most of it)
ssao = false
; volumetric light: sun shafts through trees, fog and over ridges (~0.8-1.2 ms)
volumetric_light = false
; volumetric fog: drifting ground fog lit by the sun, lanterns and fires (~0.3-0.5 ms)
volumetric_fog = false
; water reflections: lakes and rivers mirror the trees, banks and sky (~1 ms with water on screen)
water_reflections = false
shadow_size = 1024
texture_size = 1024
adaptive_quality = true
adaptive_detail = false
tri_budget = 1500000
ui_scale = 1.00
; edge_upscale: sharper edge-aware upscaling when render_scale is below 100%
edge_upscale = false
render_scale = 0.77
draw_distance = 1.50
full_map = false
fps_limit = 30
menu_fps = 30
; leaf depth pre-pass: auto (timed on your GPU), on or off. Turn off if leaves show speckles
leaf_prepass = on
; temporal upscaling: renders fewer pixels and rebuilds detail from previous frames
temporal_upscale_v2 = true
; eco: automatic quality only raises detail while the GPU stays under ~50% busy (cooler, quieter)
eco_mode = true

[world]
; weather: auto (showers come and go), rain (always raining, except in snow), clear (never rains)
weather = auto
grass_radius = 26
undergrowth_radius = 3
tree_radius = 110
rock_radius = 110

[player]
fov = 75
mouse_sensitivity = 0.0024
player_speed = 4.80
sprint_multiplier = 1.75
gravity = -18.0

[audio]
music_volume = 0.22
sfx_volume = 0.60

[hud]
hud = true
; hidden HUD pieces (bit mask, set from Options > HUD)
hud_hide = 62

[controls]
; physical key codes (GLFW); set from Options > Controls, removed lines fall back to the default
